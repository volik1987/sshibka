<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сшибка — Заря против Пепла</title>
<style>
:root{--bg:#14121a;--panel:#1f1c28;--line:#3a3448;--txt:#ece6f4;--mut:#9d95ae;--dawn:#f2c14e;--ash:#e0573f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% -10%,#30263f,#121017 65%) fixed;color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}
h1{margin:0;font-size:26px;letter-spacing:.5px}
h1 b{color:var(--dawn)} h1 i{font-style:normal;color:var(--ash)}
#app{display:flex;gap:26px;justify-content:center;align-items:flex-start;padding:22px 16px;flex-wrap:wrap}
#left{display:flex;flex-direction:column;gap:10px;align-items:center}
#turn{font-size:18px;font-weight:700;padding:8px 18px;border-radius:999px;border:2px solid currentColor;background:#0006}
#turn.dawn{color:var(--dawn)} #turn.ash{color:var(--ash)}
#board{display:grid;grid-template-columns:repeat(8,76px);grid-template-rows:repeat(8,76px);border:4px solid #4d4262;border-radius:10px;overflow:hidden;box-shadow:0 14px 50px #000a}
.cell{position:relative;cursor:pointer}
.cell.plain.l{background:#55693f}.cell.plain.d{background:#475a34}
.cell.forest.l{background:#33512e}.cell.forest.d{background:#2b4527}
.cell.rock.l{background:#6b655b}.cell.rock.d{background:#5c574e}
.cell.well{background:radial-gradient(circle,#7fe3ff 0,#2f8aa8 35%,#24505e 75%)}
.cell .ter{position:absolute;right:3px;top:1px;font-size:15px;opacity:.75;pointer-events:none}
.cell.rock .ter{font-size:40px;inset:0;display:flex;align-items:center;justify-content:center;opacity:.55}
.cell.well .ter{color:#e9fbff;text-shadow:0 0 8px #7ff}
.cell.mv::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#fff8;box-shadow:0 0 10px #fff8;pointer-events:none}
.cell.atk::after{content:"";position:absolute;inset:3px;border:3px solid #ff4b3a;border-radius:10px;box-shadow:0 0 14px #f43 inset;pointer-events:none;animation:pulse 1s infinite}
.cell.sel{box-shadow:0 0 0 3px #fff inset}
.cell.last{box-shadow:0 0 0 2px #fff5 inset}
.cell:hover{filter:brightness(1.15)}
@keyframes pulse{50%{opacity:.45}}
.piece{position:absolute;inset:7px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;pointer-events:none;transition:transform .15s}
.piece.dawn{background:radial-gradient(circle at 35% 30%,#fff4c8,#e2aa2c 58%,#7a5410);box-shadow:0 0 0 2px #fff7d0aa inset,0 4px 8px #000a}
.piece.ash{background:radial-gradient(circle at 35% 30%,#ffb7a8,#b9382a 58%,#45100b);box-shadow:0 0 0 2px #ffc0b0aa inset,0 4px 8px #000a}
.piece.leader::before{content:"♛";position:absolute;top:-9px;font-size:16px;color:#fff;text-shadow:0 0 4px #000}
.piece.dim{opacity:.55}
.hp{position:absolute;left:10px;right:10px;bottom:4px;height:5px;background:#000b;border-radius:3px;pointer-events:none}
.hp i{display:block;height:100%;border-radius:3px}
#side{width:340px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
#info .nm{font-size:19px;font-weight:700}
#info .ab{margin-top:6px;padding:6px 8px;background:#0003;border-radius:8px}
#info .ab b{color:#fff}
#info .k{display:inline-block;min-width:20px;padding:0 5px;margin-right:4px;border:1px solid #fff5;border-radius:4px;font-size:12px;text-align:center}
.mut{color:var(--mut);font-size:13px}
.dawnc{color:var(--dawn)} .ashc{color:var(--ash)}
#log{max-height:170px;overflow:auto;font-size:13px}
#log div{padding:2px 0;border-bottom:1px solid #ffffff0d}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--txt);background:#2e2940;border:1px solid #514769;border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:#3b3452}
button.pri{background:#6b4fd8;border-color:#8a72ef;font-weight:700}
button.pri:hover{background:#7b61e6}
#duel{position:fixed;inset:0;background:#07060bf2;display:none;align-items:center;justify-content:center;z-index:5}
#duel.on{display:flex}
#cv{display:block;border-radius:10px;box-shadow:0 0 60px #000;width:min(98vw,calc(96vh*960/576));height:auto}
#ovl{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#ovl.on{display:flex}
#ovl .card{background:#211d2c;border:1px solid #4d4262;border-radius:16px;padding:22px 26px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px #000}
#ovl h2{margin:0 0 10px}
#ovl ul{padding-left:20px;margin:8px 0}
#ovl li{margin:4px 0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.vs .mid{font-size:34px;align-self:center;color:#fff8}
.fc{background:#0004;border-radius:12px;padding:12px;border:2px solid}
.fc.dawn{border-color:var(--dawn)} .fc.ash{border-color:var(--ash)}
.fc .g{font-size:42px}
.keys{font-size:13px;color:var(--mut);margin-top:6px}
kbd{display:inline-block;padding:0 6px;border:1px solid #fff6;border-bottom-width:2px;border-radius:5px;font:12px/18px ui-monospace,monospace;color:#fff;background:#fff1}
.center{text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <h1><b>Сшибка</b>: Заря <span class="mut">против</span> <i>Пепла</i></h1>
    <div id="turn" class="dawn">Ход: Орден Зари</div>
    <div id="board"></div>
    <div class="mut">Шагните на клетку врага — начнётся поединок на арене</div>
  </div>
  <div id="side">
    <div class="box" id="info"><h3>Фигура</h3><div class="mut">Наведите на фигуру, чтобы увидеть её умения.</div></div>
    <div class="box"><h3>Управление в бою</h3>
      <div><span class="dawnc">Заря</span>: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ход, <kbd>F</kbd> атака, <kbd>G</kbd> умение</div>
      <div style="margin-top:4px"><span class="ashc">Пепел</span>: стрелки, <kbd>.</kbd> атака, <kbd>/</kbd> умение <span class="mut">(или <kbd>K</kbd><kbd>L</kbd>, Num1/2)</span></div>
    </div>
    <div class="box"><h3>Летопись</h3><div id="log"></div></div>
    <div class="btns">
      <button onclick="showRules()">Правила</button>
      <button onclick="askNew()">Новая игра</button>
      <button id="sndBtn" onclick="toggleSnd()">Звук: вкл</button>
    </div>
  </div>
</div>
<div id="duel"><canvas id="cv"></canvas></div>
<div id="ovl"><div class="card" id="ovc"></div></div>

<script>
'use strict';
// ---------- Фракции и фигуры ----------
const SIDES={dawn:{name:'Орден Зари',short:'Заря',col:'#f2c14e',dark:'#7a5410',p:0},ash:{name:'Клан Пепла',short:'Пепел',col:'#e0573f',dark:'#45100b',p:1}};
const TYPES={
  ratnik:{side:'dawn',name:'Ратник',g:'🛡️',hp:60,spd:150,r:16,mv:['ground',2],
    ab:[{k:'melee',n:'Меч',dmg:10,range:34,arc:1.6,cd:.45,d:'быстрый удар перед собой'},
        {k:'block',n:'Щит',dur:1,cd:3,d:'1 с: −85% урона в ближнем бою, снаряды отражаются'}]},
  luchnica:{side:'dawn',name:'Лучница',g:'🏹',hp:55,spd:165,r:15,mv:['ground',3],
    ab:[{k:'shot',n:'Стрела',dmg:10,spd:560,r:4,cd:.55,life:1.6,col:'#ffe9a8',arrow:1,d:'быстрая стрела'},
        {k:'dash',n:'Отскок',dist:160,back:1,dmg:0,cd:2.2,d:'прыжок назад, разорвать дистанцию'}]},
  grifon:{side:'dawn',name:'Грифон',g:'🦅',hp:85,spd:180,r:20,mv:['fly',4],
    ab:[{k:'melee',n:'Когти',dmg:13,range:40,arc:1.8,cd:.55,d:'широкий удар когтями'},
        {k:'dash',n:'Пике',dist:250,dmg:16,cd:3,d:'стремительный бросок, ранит при касании'}]},
  zhrica:{side:'dawn',name:'Жрица',g:'🕊️',hp:70,spd:150,r:16,mv:['fly',3],
    ab:[{k:'shot',n:'Луч',dmg:14,spd:380,r:7,cd:.7,life:2.2,col:'#fff7c0',pierce:1,d:'медленный луч света, пробивает щит'},
        {k:'heal',n:'Молитва',amt:28,dur:2,cd:7,d:'восстанавливает 28 здоровья за 2 с'}]},
  strazh:{side:'dawn',name:'Страж',g:'🗿',hp:140,spd:105,r:24,mv:['ground',2],
    ab:[{k:'melee',n:'Молот',dmg:22,range:48,arc:2,cd:1,knock:260,d:'тяжёлый удар, отбрасывает'},
        {k:'wave',n:'Сотрясение',dmg:14,radius:125,knock:380,cd:4.5,d:'удар по земле вокруг себя'}]},
  svetoch:{side:'dawn',name:'Светоч',g:'☀️',hp:120,spd:155,r:18,mv:['fly',3],leader:1,
    ab:[{k:'shot',n:'Солнечный шар',dmg:18,spd:400,r:9,cd:.75,life:2,col:'#ffcf4a',d:'огненный шар'},
        {k:'blink',n:'Вспышка',dist:180,cd:2.5,d:'мгновенный перенос вперёд'}]},
  pepelnik:{side:'ash',name:'Пепельник',g:'🪓',hp:65,spd:155,r:16,mv:['ground',2],
    ab:[{k:'melee',n:'Топор',dmg:12,range:34,arc:1.4,cd:.5,d:'рубящий удар'},
        {k:'dash',n:'Рывок',dist:150,dmg:10,cd:2.5,d:'бросок вперёд, ранит при касании'}]},
  garpun:{side:'ash',name:'Гарпунщик',g:'🔱',hp:60,spd:150,r:16,mv:['ground',3],
    ab:[{k:'shot',n:'Гарпун',dmg:15,spd:430,r:5,cd:.8,life:1.4,col:'#d8d0c2',arrow:1,knock:160,d:'тяжёлый гарпун, отталкивает'},
        {k:'trap',n:'Капкан',dmg:16,root:1.2,cd:2.5,d:'ставит капкан за спиной (до 3): урон и обездвиживание'}]},
  viverna:{side:'ash',name:'Виверна',g:'🐉',hp:100,spd:165,r:21,mv:['fly',4],
    ab:[{k:'breath',n:'Пламя',dps:40,range:115,arc:.8,dur:.7,cd:1.6,d:'струя огня перед собой'},
        {k:'gust',n:'Крылья',dmg:6,range:140,arc:1.5,knock:520,cd:3.5,d:'сдувает врага и его снаряды'}]},
  shaman:{side:'ash',name:'Шаман',g:'💀',hp:70,spd:145,r:16,mv:['fly',3],
    ab:[{k:'shot',n:'Череп',dmg:12,spd:230,r:8,cd:1.1,life:3,col:'#9cff7a',homing:2.2,d:'самонаводящийся череп'},
        {k:'totem',n:'Тотем',shots:5,interval:.7,dmg:6,cd:7,d:'тотем 5 раз стреляет во врага'}]},
  troll:{side:'ash',name:'Тролль',g:'👹',hp:135,spd:95,r:25,mv:['ground',2],
    ab:[{k:'melee',n:'Дубина',dmg:24,range:50,arc:1.8,cd:1.25,knock:260,d:'тяжёлый удар, отбрасывает'},
        {k:'shot',n:'Валун',dmg:26,spd:260,r:14,cd:4,life:2.2,col:'#8a7d6b',knock:340,rock:1,d:'бросок валуна, сбивает чужие снаряды'}]},
  vladyka:{side:'ash',name:'Владыка',g:'👿',hp:120,spd:160,r:18,mv:['fly',3],leader:1,
    ab:[{k:'shot',n:'Тени',dmg:9,spd:420,r:6,cd:.85,life:1.6,col:'#b77cff',count:3,spread:.25,d:'веер из трёх теней'},
        {k:'stealth',n:'Морок',dur:1.6,cd:5,d:'1,6 с почти невидим и быстрее'}]},
};
const BACK={dawn:['strazh','luchnica','grifon','zhrica','svetoch','grifon','luchnica','strazh'],
            ash:['troll','garpun','viverna','shaman','vladyka','viverna','garpun','troll']};
const PAWN={dawn:'ratnik',ash:'pepelnik'};
const WELLS=[[3,1],[3,5],[4,2],[4,6]];
const N=8, SAVE='sshibka-v1';
const TER_ICON={plain:'',forest:'🌲',rock:'🪨',well:'✦'};
const TER_NAME={plain:'луг',forest:'лес',rock:'скалы',well:'Источник'};

// ---------- Звук ----------
let AC=null,muted=false;
function snd(f,d=.1,type='square',v=.05,slide=0){
  if(muted)return;
  try{AC=AC||new AudioContext();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function toggleSnd(){muted=!muted;document.getElementById('sndBtn').textContent='Звук: '+(muted?'выкл':'вкл')}

// ---------- Состояние доски ----------
let G=null;
function rnd(a,b){return a+Math.random()*(b-a)}
function newGame(){
  const terr=[...Array(N)].map(()=>Array(N).fill('plain'));
  WELLS.forEach(([r,c])=>terr[r][c]='well');
  const put=(kind,n)=>{let k=0,tries=0;while(k<n&&tries++<200){const r=2+(Math.random()*2|0),c=Math.random()*N|0;
    if(terr[r][c]!=='plain'||terr[N-1-r][N-1-c]!=='plain')continue;terr[r][c]=terr[N-1-r][N-1-c]=kind;k++;}};
  put('rock',2);put('forest',4);
  const units=[];let id=1;
  for(let c=0;c<N;c++){
    units.push({id:id++,t:BACK.ash[c],side:'ash',r:0,c});
    units.push({id:id++,t:PAWN.ash,side:'ash',r:1,c});
    units.push({id:id++,t:PAWN.dawn,side:'dawn',r:6,c});
    units.push({id:id++,t:BACK.dawn[c],side:'dawn',r:7,c});
  }
  units.forEach(u=>u.hp=TYPES[u.t].hp);
  G={terr,units,turn:'dawn',log:[],sel:null,over:null,last:null,moveNo:1};
  addLog('Начало битвы. Первым ходит <span class="dawnc">Орден Зари</span>.');
  save();render();
}
function save(){try{const {terr,units,turn,log,over,last,moveNo}=G;localStorage.setItem(SAVE,JSON.stringify({terr,units,turn,log,over,last,moveNo}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE));if(s&&s.units&&!s.over){G={...s,sel:null};return true}}catch(e){}return false}
function addLog(h){G.log.unshift(h);G.log.length=Math.min(G.log.length,60)}
const unitAt=(r,c)=>G.units.find(u=>u.r===r&&u.c===c);
const inB=(r,c)=>r>=0&&c>=0&&r<N&&c<N;
const sideHtml=s=>`<span class="${s}c">${SIDES[s].name}</span>`;
const uName=u=>`<span class="${u.side}c">${TYPES[u.t].name}</span>`;

function movesOf(u){
  const T=TYPES[u.t],[kind,n]=T.mv,res=[];
  if(kind==='fly'){
    for(let r=u.r-n;r<=u.r+n;r++)for(let c=u.c-n;c<=u.c+n;c++){
      if(!inB(r,c)||(r===u.r&&c===u.c))continue;
      const o=unitAt(r,c);if(o&&o.side===u.side)continue;
      res.push({r,c,atk:!!o});
    }
    return res;
  }
  const seen=new Set([u.r*N+u.c]),atk=new Set();let front=[[u.r,u.c]];
  for(let d=1;d<=n;d++){const nx=[];
    for(const [r,c] of front)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const rr=r+dr,cc=c+dc;if((!dr&&!dc)||!inB(rr,cc)||G.terr[rr][cc]==='rock')continue;
      const o=unitAt(rr,cc),k=rr*N+cc;
      if(o){if(o.side!==u.side&&!atk.has(k)){atk.add(k);res.push({r:rr,c:cc,atk:true})}continue}
      if(seen.has(k))continue;seen.add(k);res.push({r:rr,c:cc,atk:false});nx.push([rr,cc]);
    }
    front=nx;
  }
  return res;
}

// ---------- Отрисовка доски ----------
const boardEl=document.getElementById('board');
let hoverU=null;
function render(){
  const mv=G.sel?movesOf(G.sel):[];
  const mvMap=new Map(mv.map(m=>[m.r*N+m.c,m]));
  let h='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const t=G.terr[r][c],u=unitAt(r,c),m=mvMap.get(r*N+c);
    let cls=`cell ${t} ${(r+c)%2?'d':'l'}`;
    if(m)cls+=m.atk?' atk':' mv';
    if(G.sel&&G.sel===u)cls+=' sel';
    if(G.last&&G.last.some(([a,b])=>a===r&&b===c))cls+=' last';
    h+=`<div class="${cls}" data-r="${r}" data-c="${c}"><span class="ter">${TER_ICON[t]}</span>`;
    if(u){const T=TYPES[u.t],p=u.hp/T.hp;
      h+=`<div class="piece ${u.side}${T.leader?' leader':''}${u.side!==G.turn&&!G.over?' dim':''}">${T.g}</div>`;
      h+=`<div class="hp"><i style="width:${Math.max(4,p*100)}%;background:${p>.6?'#5f5':p>.3?'#fd4':'#f54'}"></i></div>`;}
    h+='</div>';
  }
  boardEl.innerHTML=h;
  const tEl=document.getElementById('turn');
  tEl.className=G.turn;
  tEl.textContent=G.over?'Битва окончена':`Ход ${G.moveNo}: ${SIDES[G.turn].name}`;
  document.getElementById('log').innerHTML=G.log.map(x=>`<div>${x}</div>`).join('');
  showInfo(hoverU||G.sel);
}
function showInfo(u,vs){
  const el=document.getElementById('info');
  if(!u){el.innerHTML='<h3>Фигура</h3><div class="mut">Наведите на фигуру, чтобы увидеть её умения. Клик по своей фигуре — выбрать, клик по подсвеченной клетке — ход.</div>';return}
  const T=TYPES[u.t],p=SIDES[u.side].p,keys=p?['.','/']:['F','G'];
  const ter=G.terr[u.r][u.c];
  el.innerHTML=`<h3>${SIDES[u.side].name}${T.leader?' · лидер':''}</h3>
    <div class="nm"><span style="font-size:26px">${T.g}</span> ${T.name}</div>
    <div>Здоровье: <b>${u.hp}</b> / ${T.hp} · скорость ${T.spd}</div>
    <div class="mut">${T.mv[0]==='fly'?'Летает':'Ходит по земле'} на ${T.mv[1]} кл. · стоит: ${TER_NAME[ter]}</div>
    ${T.ab.map((a,i)=>`<div class="ab"><span class="k">${keys[i]}</span><b>${a.n}</b> <span class="mut">— ${a.d} (перезарядка ${a.cd} с)</span></div>`).join('')}
    ${vs?`<div class="ab" style="border:1px solid #f54">⚔ Нападение на ${uName(vs)} (${vs.hp}/${TYPES[vs.t].hp}), арена: ${TER_NAME[G.terr[vs.r][vs.c]]}</div>`:''}`;
}
boardEl.addEventListener('mousemove',e=>{
  const cell=e.target.closest('.cell');if(!cell)return;
  const r=+cell.dataset.r,c=+cell.dataset.c,u=unitAt(r,c);
  if(G.sel&&u&&u.side!==G.sel.side&&movesOf(G.sel).some(m=>m.r===r&&m.c===c)){showInfo(G.sel,u);return}
  if(u!==hoverU){hoverU=u;showInfo(u||G.sel)}
});
boardEl.addEventListener('mouseleave',()=>{hoverU=null;showInfo(G.sel)});
boardEl.addEventListener('click',e=>{
  const cell=e.target.closest('.cell');if(!cell||G.over||D)return;
  const r=+cell.dataset.r,c=+cell.dataset.c,u=unitAt(r,c);
  if(G.sel){
    const m=movesOf(G.sel).find(m=>m.r===r&&m.c===c);
    if(m){doMove(G.sel,m);return}
  }
  if(u&&u.side===G.turn){G.sel=(G.sel===u?null:u);snd(520,.05,'triangle',.04)}
  else G.sel=null;
  render();
});

function doMove(u,m){
  G.sel=null;
  if(!m.atk){
    G.last=[[u.r,u.c],[m.r,m.c]];
    u.r=m.r;u.c=m.c;snd(330,.07,'triangle',.05);
    addLog(`${uName(u)} → ${'abcdefgh'[m.c]}${N-m.r}${G.terr[m.r][m.c]==='well'?' (Источник)':''}`);
    endTurn();
  } else startDuel(u,unitAt(m.r,m.c));
}

function checkWin(){
  const lead=s=>G.units.some(u=>u.side===s&&TYPES[u.t].leader);
  const dl=lead('dawn'),al=lead('ash');
  if(!dl&&!al)return {winner:null,why:'Оба лидера пали в одном поединке.'};
  if(!dl)return {winner:'ash',why:'Светоч повержен.'};
  if(!al)return {winner:'dawn',why:'Владыка повержен.'};
  for(const s of ['dawn','ash']){
    if(!G.units.some(u=>u.side!==s))return {winner:s,why:'Вражеская армия уничтожена.'};
    if(WELLS.every(([r,c])=>{const u=unitAt(r,c);return u&&u.side===s}))return {winner:s,why:'Все четыре Источника под контролем.'};
  }
  return null;
}
function endTurn(){
  let w=checkWin();
  if(!w){
    G.turn=G.turn==='dawn'?'ash':'dawn';if(G.turn==='dawn')G.moveNo++;
    // восстановление в начале хода
    for(const u of G.units)if(u.side===G.turn){
      const mx=TYPES[u.t].hp,k=G.terr[u.r][u.c]==='well'?.25:.05;
      u.hp=Math.min(mx,u.hp+Math.ceil(mx*k));
    }
    if(!G.units.some(u=>u.side===G.turn&&movesOf(u).length))w={winner:G.turn==='dawn'?'ash':'dawn',why:'Противнику некуда ходить.'};
  }
  if(w){G.over=w;addLog(w.winner?`🏆 Победа: ${sideHtml(w.winner)}. ${w.why}`:'Ничья. '+w.why);save();render();showOver();return}
  save();render();
}
function showOver(){
  const w=G.over;snd(523,.2,'triangle',.06);setTimeout(()=>snd(784,.35,'triangle',.06),180);
  modal(`<div class="center"><div style="font-size:60px">${w.winner?TYPES[w.winner==='dawn'?'svetoch':'vladyka'].g:'⚖️'}</div>
    <h2>${w.winner?'Победа: '+sideHtml(w.winner):'Ничья'}</h2><p>${w.why}</p>
    <div class="btns" style="justify-content:center"><button class="pri" data-pri onclick="newGame();closeModal()">Новая игра</button><button onclick="closeModal()">Посмотреть доску</button></div></div>`);
}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=960,H=576,AR={x0:16,y0:74,x1:944,y1:560};
const CTRL=[{u:['KeyW'],d:['KeyS'],l:['KeyA'],r:['KeyD'],a:['KeyF'],b:['KeyG'],ka:'F',kb:'G'},
            {u:['ArrowUp'],d:['ArrowDown'],l:['ArrowLeft'],r:['ArrowRight'],a:['Period','KeyK','Numpad1','NumpadDecimal'],b:['Slash','KeyL','Numpad2','NumpadDivide'],ka:'.',kb:'/'}];
const keys=new Set();
const held=a=>a.some(k=>keys.has(k));
let D=null;
function fitCanvas(){const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
fitCanvas();

function mkFighter(u,idx){
  const T=TYPES[u.t];
  return {u,T,idx,side:u.side,col:SIDES[u.side].col,dark:SIDES[u.side].dark,
    x:idx?AR.x1-110:AR.x0+110,y:(AR.y0+AR.y1)/2,face:idx?Math.PI:0,r:T.r,spd:T.spd,hp:u.hp,max:T.hp,
    cd:[0,0],vx:0,vy:0,dashT:0,dvx:0,dvy:0,dashDmg:0,dashHit:false,blockT:0,stealthT:0,healT:0,healRate:0,rootT:0,breathT:0,breathAb:null,flash:0,acc:0,dead:false,bob:Math.random()*6};
}
function genArena(ter){
  const obs=[],decor=[],pool=ter==='well'?{x:W/2,y:(AR.y0+AR.y1)/2,r:70}:null;
  const spec={plain:[3,16,26,'rock'],forest:[11,16,25,'tree'],rock:[6,30,50,'rock'],well:[4,18,26,'rock']}[ter];
  const spawns=[[AR.x0+110,(AR.y0+AR.y1)/2],[AR.x1-110,(AR.y0+AR.y1)/2]];
  let tries=0;
  while(obs.length<spec[0]&&tries++<500){
    const r=rnd(spec[1],spec[2]),x=rnd(AR.x0+r+30,AR.x1-r-30),y=rnd(AR.y0+r+20,AR.y1-r-20);
    if(spawns.some(([sx,sy])=>Math.hypot(x-sx,y-sy)<r+90))continue;
    if(pool&&Math.hypot(x-pool.x,y-pool.y)<r+pool.r+20)continue;
    if(obs.some(o=>Math.hypot(x-o.x,y-o.y)<r+o.r+48))continue;
    obs.push({x,y,r,kind:spec[3],seed:Math.random()});
  }
  for(let i=0;i<140;i++)decor.push({x:rnd(AR.x0,AR.x1),y:rnd(AR.y0,AR.y1),s:rnd(2,5),a:rnd(.08,.22)});
  return {obs,decor,pool};
}
function startDuel(att,def){
  const ter=G.terr[def.r][def.c];
  const dawnU=att.side==='dawn'?att:def,ashU=att.side==='ash'?att:def;
  const ar=genArena(ter);
  D={att,def,ter,cell:{r:def.r,c:def.c},f:[mkFighter(dawnU,0),mkFighter(ashU,1)],proj:[],fx:[],parts:[],floats:[],traps:[],totems:[],later:[],
     ...ar,t:0,limit:60,phase:'intro',cdT:0,endT:0,timeout:false,shake:0};
  document.getElementById('duel').classList.add('on');
  snd(196,.25,'sawtooth',.05,.5);
  const card=f=>{const p=f.idx,k=CTRL[p];return `<div class="fc ${f.side}"><div class="g">${f.T.g}</div>
    <div style="font-size:20px;font-weight:700">${f.T.name}${f.u===att?' <span class="mut">(нападает)</span>':''}</div>
    <div>Здоровье ${Math.ceil(f.hp)} / ${f.max}</div>
    ${f.T.ab.map((a,i)=>`<div style="margin-top:6px"><kbd>${i?k.kb:k.ka}</kbd> <b>${a.n}</b> <span class="mut">— ${a.d}</span></div>`).join('')}
    <div class="keys">Движение: ${p?'стрелки':'<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>'}</div></div>`};
  modal(`<h2 class="center">Поединок · арена: ${TER_NAME[ter]}</h2>
    <div class="vs">${card(D.f[0])}<div class="mid">⚔</div>${card(D.f[1])}</div>
    ${ter==='well'?'<p class="center mut">В центре — целебный пруд: стоя в нём, боец лечится.</p>':''}
    <div class="btns" style="justify-content:center;margin-top:14px"><button class="pri" data-pri onclick="beginFight()">В бой! (Пробел)</button></div>`);
}
function beginFight(){closeModal();if(!D)return;D.phase='count';D.cdT=2.4;snd(440,.1,'square',.04)}

const ad=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return Math.abs(d)};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const enemyOf=f=>D.f[1-f.idx];
function inCone(f,e,range,arc){
  const d=dist(f,e);if(d>range+f.r+e.r)return false;
  return ad(Math.atan2(e.y-f.y,e.x-f.x),f.face)<=arc/2+Math.asin(Math.min(1,e.r/Math.max(d,1)));
}
function inObs(x,y,r){return D.obs.find(o=>Math.hypot(x-o.x,y-o.y)<o.r+r)}
function inArena(x,y,r){return x>AR.x0+r&&x<AR.x1-r&&y>AR.y0+r&&y<AR.y1-r}
function burst(x,y,col,n=10,sp=160){for(let i=0;i<n;i++){const a=rnd(0,7),s=rnd(.3,1)*sp;D.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.25,.55),max:.55,col,r:rnd(1.5,3.5)})}}
function floatTxt(x,y,txt,col){D.floats.push({x,y,txt,col,t:0})}

function hit(t,dmg,src,o={}){
  if(t.dead||!D||D.phase==='done')return;
  if(t.blockT>0&&(o.melee||o.wave||o.dash)){dmg*=.15;if(!o.tick){floatTxt(t.x,t.y-t.r-10,'блок','#9df');snd(900,.06,'triangle',.05)}}
  t.hp-=dmg;t.flash=.12;t.acc+=dmg;
  if(!o.tick||t.acc>=5){const v=Math.round(t.acc);if(v>0)floatTxt(t.x+rnd(-8,8),t.y-t.r-8,'-'+v,o.tick?'#ffb04a':'#fff');t.acc=0}
  if(o.knock){const a=o.ang??Math.atan2(t.y-src.y,t.x-src.x);t.vx+=Math.cos(a)*o.knock;t.vy+=Math.sin(a)*o.knock}
  if(o.root)t.rootT=Math.max(t.rootT,o.root);
  if(!o.tick){burst(t.x,t.y,'#fff',8,180);snd(150+Math.random()*60,.08,'square',.05,.5);D.shake=Math.max(D.shake,dmg>15?7:3)}
  if(t.hp<=0){t.hp=0;t.dead=true;burst(t.x,t.y,t.col,40,260);burst(t.x,t.y,'#fff',20,200);D.shake=12;
    snd(110,.5,'sawtooth',.07,.3);if(D.phase==='fight'){D.phase='end';D.endT=1.8}}
}

function use(f,i){
  const ab=f.T.ab[i];
  if(f.cd[i]>0||f.dead||f.dashT>0)return;
  f.cd[i]=ab.cd;if(ab.k!=='stealth')f.stealthT=0;
  const a=f.face,c=Math.cos(a),s=Math.sin(a),e=enemyOf(f);
  switch(ab.k){
    case 'melee':
      D.fx.push({k:'slash',f,a,range:ab.range+f.r,arc:ab.arc,t:0,dur:.18,col:f.side==='dawn'?'#fff3b0':'#ffb0a0'});
      snd(260,.08,'sawtooth',.035,.4);
      D.later.push({t:.06,fn:()=>{if(!f.dead&&inCone(f,e,ab.range,ab.arc))hit(e,ab.dmg,f,{melee:1,knock:ab.knock||140,ang:f.face})}});
      break;
    case 'shot':{
      const n=ab.count||1,ea=Math.atan2(e.y-f.y,e.x-f.x);
      const base=!e.dead&&e.stealthT<=0&&ad(ea,a)<.45?ea:a; // небольшая доводка на врага
      for(let j=0;j<n;j++){const aa=base+(j-(n-1)/2)*(ab.spread||0);
        D.proj.push({x:f.x+Math.cos(aa)*(f.r+ab.r+2),y:f.y+Math.sin(aa)*(f.r+ab.r+2),vx:Math.cos(aa)*ab.spd,vy:Math.sin(aa)*ab.spd,r:ab.r,dmg:ab.dmg,
          owner:f,life:ab.life,col:ab.col,homing:ab.homing||0,pierce:ab.pierce,knock:ab.knock||60,arrow:ab.arrow,rock:ab.rock,done:false})}
      snd(ab.rock?120:ab.arrow?700:500,.09,ab.homing?'sine':'triangle',.045,ab.rock?.6:1.6);break;}
    case 'dash':{const dir=ab.back?-1:1,sp=760;f.dashT=ab.dist/sp;f.dvx=c*sp*dir;f.dvy=s*sp*dir;f.dashDmg=ab.dmg;f.dashHit=false;snd(300,.15,'sawtooth',.04,2);break;}
    case 'block':f.blockT=ab.dur;snd(800,.12,'triangle',.04,1.3);break;
    case 'heal':f.healT=ab.dur;f.healRate=ab.amt/ab.dur;snd(660,.3,'sine',.05,1.5);break;
    case 'wave':
      D.fx.push({k:'ring',x:f.x,y:f.y,r:ab.radius+f.r,t:0,dur:.35,col:'#e8d7a8'});D.shake=8;snd(80,.35,'sawtooth',.08,.5);
      if(dist(f,e)<=ab.radius+f.r+e.r)hit(e,ab.dmg,f,{wave:1,knock:ab.knock});
      break;
    case 'gust':
      D.fx.push({k:'cone',f,a,range:ab.range+f.r,arc:ab.arc,t:0,dur:.3,col:'#cfe8ff'});snd(200,.3,'sine',.05,.4);
      if(inCone(f,e,ab.range,ab.arc))hit(e,ab.dmg,f,{knock:ab.knock,ang:a});
      for(const p of D.proj)if(p.owner!==f&&Math.hypot(p.x-f.x,p.y-f.y)<ab.range+f.r+20&&ad(Math.atan2(p.y-f.y,p.x-f.x),a)<ab.arc/2+.2){p.done=true;burst(p.x,p.y,'#cfe8ff',5,100)}
      break;
    case 'breath':f.breathT=ab.dur;f.breathAb=ab;snd(90,ab.dur,'sawtooth',.03,1.8);break;
    case 'trap':{
      const x=f.x-c*(f.r+14),y=f.y-s*(f.r+14);
      D.traps.push({x,y,owner:f,arm:.6,dmg:ab.dmg,root:ab.root});
      const mine=D.traps.filter(t=>t.owner===f);if(mine.length>3)D.traps.splice(D.traps.indexOf(mine[0]),1);
      snd(400,.06,'square',.04,.5);break;}
    case 'totem':{
      let x=f.x+c*(f.r+24),y=f.y+s*(f.r+24);
      if(inObs(x,y,12)||!inArena(x,y,12)){x=f.x;y=f.y}
      D.totems.push({x,y,owner:f,shots:ab.shots,t:.5,iv:ab.interval,dmg:ab.dmg,fade:0});snd(220,.2,'triangle',.05,1.5);break;}
    case 'blink':
      for(let d=ab.dist;d>=0;d-=8){const x=f.x+c*d,y=f.y+s*d;
        if(inArena(x,y,f.r)&&!inObs(x,y,f.r)&&Math.hypot(x-e.x,y-e.y)>f.r+e.r+2){
          burst(f.x,f.y,'#ffe680',16,140);f.x=x;f.y=y;burst(x,y,'#fff',16,140);break}}
      snd(1200,.15,'sine',.05,.3);break;
    case 'stealth':f.stealthT=ab.dur;burst(f.x,f.y,'#b77cff',18,120);snd(300,.3,'sine',.04,.5);break;
  }
}

function updFighter(f,dt){
  if(f.dead)return;
  f.cd[0]=Math.max(0,f.cd[0]-dt);f.cd[1]=Math.max(0,f.cd[1]-dt);
  if(f.healT>0){f.hp=Math.min(f.max,f.hp+f.healRate*Math.min(dt,f.healT));if(Math.random()<.3)D.parts.push({x:f.x+rnd(-f.r,f.r),y:f.y+f.r,vx:0,vy:-60,life:.6,max:.6,col:'#8f8',r:2.5})}
  if(D.pool&&dist(f,D.pool)<D.pool.r){f.hp=Math.min(f.max,f.hp+6*dt);if(Math.random()<.15)D.parts.push({x:f.x+rnd(-f.r,f.r),y:f.y,vx:0,vy:-50,life:.5,max:.5,col:'#9ff',r:2})}
  for(const k of ['blockT','stealthT','healT','rootT','flash','breathT'])f[k]=Math.max(0,f[k]-dt);
  const k=CTRL[f.idx],ctl=D.phase==='fight';
  const mx=ctl?(held(k.r)?1:0)-(held(k.l)?1:0):0,my=ctl?(held(k.d)?1:0)-(held(k.u)?1:0):0;
  if(f.dashT>0){
    const st=Math.min(dt,f.dashT);f.dashT-=dt;f.x+=f.dvx*st;f.y+=f.dvy*st;
    if(Math.random()<.8)D.parts.push({x:f.x,y:f.y,vx:0,vy:0,life:.25,max:.25,col:f.col,r:f.r*.5});
    const e=enemyOf(f);
    if(!f.dashHit&&f.dashDmg>0&&!e.dead&&dist(f,e)<f.r+e.r+6){f.dashHit=true;hit(e,f.dashDmg,f,{dash:1,knock:320,ang:Math.atan2(f.dvy,f.dvx)});f.dashT=0}
  } else if(mx||my){
    f.face=Math.atan2(my,mx);
    if(f.rootT<=0){const l=Math.hypot(mx,my),sp=f.spd*(f.stealthT>0?1.7:1)*(f.breathT>0?.45:1)*(f.blockT>0?.5:1);
      f.x+=mx/l*sp*dt;f.y+=my/l*sp*dt;f.bob+=dt*12;}
  }
  f.x+=f.vx*dt;f.y+=f.vy*dt;const fr=Math.pow(.003,dt);f.vx*=fr;f.vy*=fr;
  let bump=false;
  for(const o of D.obs){const dx=f.x-o.x,dy=f.y-o.y,d=Math.hypot(dx,dy)||1,m=o.r+f.r;if(d<m){f.x=o.x+dx/d*m;f.y=o.y+dy/d*m;bump=true}}
  const cx=Math.max(AR.x0+f.r,Math.min(AR.x1-f.r,f.x)),cy=Math.max(AR.y0+f.r,Math.min(AR.y1-f.r,f.y));
  if(cx!==f.x||cy!==f.y){bump=true;f.x=cx;f.y=cy}
  if(bump&&f.dashT>0)f.dashT=0;
  if(f.breathT>0&&f.breathAb){
    const ab=f.breathAb,e=enemyOf(f);
    for(let i=0;i<3;i++){const aa=f.face+rnd(-ab.arc/2,ab.arc/2),sp=rnd(250,380);
      D.parts.push({x:f.x+Math.cos(f.face)*f.r,y:f.y+Math.sin(f.face)*f.r,vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,life:(ab.range+f.r)/sp,max:(ab.range+f.r)/sp,col:Math.random()<.5?'#ffb030':'#ff5a20',r:rnd(3,6),fire:1})}
    if(!e.dead&&inCone(f,e,ab.range,ab.arc))hit(e,ab.dps*dt,f,{tick:1});
  }
  if(ctl){if(held(k.a))use(f,0);if(held(k.b))use(f,1)}
}

function update(dt){
  if(D.phase==='intro'||D.phase==='done')return;
  if(D.phase==='count'){D.cdT-=dt;if(D.cdT<=0){D.phase='fight';snd(880,.2,'square',.05)}return}
  if(D.phase==='end'){D.endT-=dt;dt*=.35;if(D.endT<=0){D.phase='done';showDuelResult();return}}
  if(D.phase==='fight'){D.t+=dt;if(D.t>=D.limit){D.timeout=true;D.phase='end';D.endT=1.2;snd(300,.4,'triangle',.05,.5)}}
  for(const f of D.f)updFighter(f,dt);
  // столкновение бойцов
  const [a,b]=D.f;
  if(!a.dead&&!b.dead){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,m=a.r+b.r;
    if(d<m){const p=(m-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p}}
  for(const l of D.later){l.t-=dt;if(l.t<=0){l.fn();l.gone=true}}
  D.later=D.later.filter(l=>!l.gone);
  // снаряды
  for(const p of D.proj){
    if(p.done)continue;
    const e=enemyOf(p.owner);
    if(p.homing&&!e.dead&&e.stealthT<=0){
      const want=Math.atan2(e.y-p.y,e.x-p.x),cur=Math.atan2(p.vy,p.vx),sp=Math.hypot(p.vx,p.vy);
      let d=want-cur;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
      const na=cur+Math.max(-p.homing*dt,Math.min(p.homing*dt,d));p.vx=Math.cos(na)*sp;p.vy=Math.sin(na)*sp;
    }
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0||!inArena(p.x,p.y,-10)){p.done=true;continue}
    if(inObs(p.x,p.y,p.r*.6)){p.done=true;burst(p.x,p.y,p.col,6,120);continue}
    if(!e.dead&&Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){
      if(e.blockT>0&&!p.pierce){ // отражение щитом
        const sp=Math.hypot(p.vx,p.vy),o=p.owner,an=Math.atan2(o.y-p.y,o.x-p.x);
        p.vx=Math.cos(an)*sp;p.vy=Math.sin(an)*sp;p.owner=e;p.life=Math.max(p.life,1.2);burst(p.x,p.y,'#9df',8,150);snd(1000,.08,'triangle',.05);continue}
      if(p.pierce){if(p.hitDone)continue;p.hitDone=true}else p.done=true;
      hit(e,p.dmg,p,{knock:p.knock,ang:Math.atan2(p.vy,p.vx)});
    }
  }
  // встречные снаряды гасят друг друга (валун сносит всё)
  for(let i=0;i<D.proj.length;i++)for(let j=i+1;j<D.proj.length;j++){
    const p=D.proj[i],q=D.proj[j];if(p.done||q.done||p.owner===q.owner)continue;
    if(Math.hypot(p.x-q.x,p.y-q.y)<p.r+q.r){if(!p.rock)p.done=true;if(!q.rock)q.done=true;burst((p.x+q.x)/2,(p.y+q.y)/2,'#fff',8,140)}
  }
  D.proj=D.proj.filter(p=>!p.done);
  // капканы
  for(const t of D.traps){t.arm-=dt;const e=enemyOf(t.owner);
    if(t.arm<=0&&!e.dead&&e.dashT<=0&&Math.hypot(t.x-e.x,t.y-e.y)<e.r+8){t.gone=true;hit(e,t.dmg,t,{root:t.root});D.fx.push({k:'ring',x:t.x,y:t.y,r:26,t:0,dur:.25,col:'#d8d0c2'})}}
  D.traps=D.traps.filter(t=>!t.gone);
  // тотемы
  for(const t of D.totems){
    if(t.shots<=0){t.fade+=dt;continue}
    t.t-=dt;const e=enemyOf(t.owner);
    if(t.t<=0&&!e.dead&&e.stealthT<=0){t.t=t.iv;t.shots--;const a=Math.atan2(e.y-t.y,e.x-t.x);
      D.proj.push({x:t.x+Math.cos(a)*16,y:t.y-14+Math.sin(a)*16,vx:Math.cos(a)*380,vy:Math.sin(a)*380,r:5,dmg:t.dmg,owner:t.owner,life:2,col:'#9cff7a',knock:40});snd(620,.05,'triangle',.03)}
  }
  D.totems=D.totems.filter(t=>t.fade<.5);
  for(const p of D.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(!p.fire){p.vx*=.9;p.vy*=.9}}
  D.parts=D.parts.filter(p=>p.life>0);
  for(const x of D.fx)x.t+=dt;D.fx=D.fx.filter(x=>x.t<x.dur);
  for(const x of D.floats){x.t+=dt;x.y-=40*dt}D.floats=D.floats.filter(x=>x.t<1);
  D.shake=Math.max(0,D.shake-dt*30);
}

function showDuelResult(){
  const fa=D.f.find(f=>f.u===D.att),fd=D.f.find(f=>f.u===D.def);
  let h;
  if(D.timeout&&!fa.dead&&!fd.dead)h=`<h2>Время вышло</h2><p>${uName(D.att)} отступает на прежнюю клетку.</p>`;
  else if(fa.dead&&fd.dead)h=`<h2>Оба пали!</h2><p>${uName(D.att)} и ${uName(D.def)} сразили друг друга.</p>`;
  else{const w=fa.dead?fd:fa,l=fa.dead?fa:fd;
    h=`<div style="font-size:54px">${w.T.g}</div><h2>${uName(w.u)} побеждает</h2><p>${uName(l.u)} выбывает из битвы. Осталось здоровья: <b>${Math.max(1,Math.ceil(w.hp))}</b> / ${w.max}</p>`}
  modal(`<div class="center">${h}<button class="pri" data-pri onclick="finishDuel()">К доске (Пробел)</button></div>`);
}
function finishDuel(){
  closeModal();if(!D)return;
  const {att,def,cell}=D,fa=D.f.find(f=>f.u===att),fd=D.f.find(f=>f.u===def);
  att.hp=fa.dead?0:Math.max(1,Math.ceil(fa.hp));def.hp=fd.dead?0:Math.max(1,Math.ceil(fd.hp));
  const from=[att.r,att.c];
  if(fa.dead)G.units=G.units.filter(u=>u!==att);
  if(fd.dead){G.units=G.units.filter(u=>u!==def);if(!fa.dead){att.r=cell.r;att.c=cell.c}}
  G.last=[from,[cell.r,cell.c]];
  if(D.timeout&&!fa.dead&&!fd.dead)addLog(`⚔ ${uName(att)} и ${uName(def)}: ничья по времени`);
  else if(fa.dead&&fd.dead)addLog(`⚔ ${uName(att)} и ${uName(def)} пали оба`);
  else addLog(`⚔ ${uName(fa.dead?def:att)} одолевает: ${uName(fa.dead?att:def)} выбывает`);
  D=null;document.getElementById('duel').classList.remove('on');keys.clear();
  endTurn();
}

// ---------- Рисование арены ----------
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const BG={plain:['#557140','#4a6338'],forest:['#35532e','#2b4526'],rock:['#6a645a','#5a554c'],well:['#406a5c','#35594d']};
function draw(){
  const ter=D.ter;
  ctx.save();ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#16131d';ctx.fillRect(0,0,W,H);
  if(D.shake>0)ctx.translate(rnd(-D.shake,D.shake)*.5,rnd(-D.shake,D.shake)*.5);
  // поле
  const g=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,560);g.addColorStop(0,BG[ter][0]);g.addColorStop(1,BG[ter][1]);
  ctx.fillStyle=g;ctx.fillRect(AR.x0,AR.y0,AR.x1-AR.x0,AR.y1-AR.y0);
  for(const d of D.decor){ctx.fillStyle=`rgba(${ter==='rock'?'30,25,20':'190,230,140'},${d.a})`;ctx.beginPath();ctx.arc(d.x,d.y,d.s,0,7);ctx.fill()}
  if(D.pool){const p=D.pool,pg=ctx.createRadialGradient(p.x,p.y,5,p.x,p.y,p.r);pg.addColorStop(0,'#bff6ff');pg.addColorStop(.6,'#3fb2d0');pg.addColorStop(1,'#2a7f9a00');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    ctx.strokeStyle='#dfffff55';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.5+.3*Math.sin(performance.now()/600)),0,7);ctx.stroke()}
  ctx.strokeStyle='#0008';ctx.lineWidth=4;ctx.strokeRect(AR.x0,AR.y0,AR.x1-AR.x0,AR.y1-AR.y0);
  // капканы
  for(const t of D.traps){ctx.globalAlpha=t.arm>0?.9:.45;ctx.strokeStyle='#cfc6b4';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2,rr=i%2?7:12;ctx.lineTo(t.x+Math.cos(a)*rr,t.y+Math.sin(a)*rr)}ctx.closePath();ctx.stroke();ctx.globalAlpha=1}
  // препятствия: тени
  for(const o of D.obs){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(o.x+6,o.y+8,o.r,o.r*.85,0,0,7);ctx.fill()}
  for(const o of D.obs){
    if(o.kind==='tree'){
      ctx.fillStyle='#1d3a1a';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();
      ctx.fillStyle='#2f5d28';ctx.beginPath();ctx.arc(o.x-o.r*.15,o.y-o.r*.15,o.r*.78,0,7);ctx.fill();
      ctx.fillStyle='#4a8a3a';ctx.beginPath();ctx.arc(o.x-o.r*.3,o.y-o.r*.3,o.r*.4,0,7);ctx.fill();
    } else {
      ctx.fillStyle='#4b463f';ctx.beginPath();
      for(let i=0;i<9;i++){const a=i/9*Math.PI*2,rr=o.r*(.88+.12*Math.sin(i*2.3+o.seed*9));ctx.lineTo(o.x+Math.cos(a)*rr,o.y+Math.sin(a)*rr)}
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#7b746a';ctx.beginPath();ctx.ellipse(o.x-o.r*.2,o.y-o.r*.25,o.r*.55,o.r*.45,-.4,0,7);ctx.fill();
    }
  }
  // тотемы
  for(const t of D.totems){ctx.globalAlpha=1-t.fade*2;ctx.fillStyle='#5b3b22';ctx.fillRect(t.x-4,t.y-16,8,22);
    ctx.font=`20px ${EMOJI}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💀',t.x,t.y-18);
    ctx.fillStyle='#9cff7a';for(let i=0;i<t.shots;i++)ctx.fillRect(t.x-10+i*5,t.y+10,3,3);ctx.globalAlpha=1}
  // бойцы
  for(const f of D.f)drawFighter(f);
  // снаряды
  for(const p of D.proj){
    if(p.arrow){const a=Math.atan2(p.vy,p.vx);ctx.strokeStyle=p.col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x-Math.cos(a)*18,p.y-Math.sin(a)*18);ctx.lineTo(p.x,p.y);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill();continue}
    if(p.rock){ctx.fillStyle='#0006';ctx.beginPath();ctx.arc(p.x+5,p.y+6,p.r,0,7);ctx.fill();ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
      ctx.fillStyle='#a99c88';ctx.beginPath();ctx.arc(p.x-4,p.y-4,p.r*.45,0,7);ctx.fill();continue}
    ctx.globalAlpha=.35;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.r*.45,0,7);ctx.fill();
  }
  // эффекты
  for(const x of D.fx){const k=x.t/x.dur;ctx.globalAlpha=1-k;
    if(x.k==='slash'){ctx.strokeStyle=x.col;ctx.lineWidth=7*(1-k)+2;ctx.beginPath();ctx.arc(x.f.x,x.f.y,x.range*(.7+.3*k),x.a-x.arc/2,x.a+x.arc/2);ctx.stroke()}
    else if(x.k==='ring'){ctx.strokeStyle=x.col;ctx.lineWidth=6*(1-k)+1;ctx.beginPath();ctx.arc(x.x,x.y,x.r*(.3+.7*k),0,7);ctx.stroke()}
    else if(x.k==='cone'){ctx.fillStyle=x.col;ctx.globalAlpha=(1-k)*.35;ctx.beginPath();ctx.moveTo(x.f.x,x.f.y);ctx.arc(x.f.x,x.f.y,x.range*(.4+.6*k),x.a-x.arc/2,x.a+x.arc/2);ctx.closePath();ctx.fill()}
    ctx.globalAlpha=1}
  for(const p of D.parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.fire?1+(1-p.life/p.max):1),0,7);ctx.fill()}
  ctx.globalAlpha=1;
  ctx.font='bold 18px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const x of D.floats){ctx.globalAlpha=1-x.t;ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(x.txt,x.x,x.y);ctx.fillStyle=x.col;ctx.fillText(x.txt,x.x,x.y)}
  ctx.globalAlpha=1;
  ctx.restore();
  drawHud();
  if(D.phase==='count'){const n=Math.ceil(D.cdT/.8);ctx.font='bold 110px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=8;ctx.strokeStyle='#000';const s=n>0?String(n):'';ctx.strokeText(s,W/2,H/2);ctx.fillStyle='#fff';ctx.fillText(s,W/2,H/2)}
  if(D.phase==='fight'&&D.t<.6){ctx.globalAlpha=1-D.t/.6;ctx.font='bold 90px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText('БОЙ!',W/2,H/2);ctx.fillStyle='#ffd34a';ctx.fillText('БОЙ!',W/2,H/2);ctx.globalAlpha=1}
}
function drawFighter(f){
  const y=f.y+(f.dead?0:Math.sin(f.bob)*1.5);
  ctx.save();
  ctx.globalAlpha=f.dead?.25:f.stealthT>0?.13:1;
  ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(f.x+3,f.y+f.r*.8,f.r*.95,f.r*.4,0,0,7);ctx.fill();
  if(f.blockT>0){ctx.strokeStyle='#9df';ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,y,f.r+7,0,7);ctx.stroke();ctx.fillStyle='#9df3';ctx.fill()}
  if(f.healT>0){ctx.strokeStyle='#7f7';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(f.x,y,f.r+5,0,7);ctx.stroke();ctx.setLineDash([])}
  if(f.rootT>0){ctx.strokeStyle='#c9a46a';ctx.lineWidth=3;ctx.setLineDash([3,3]);ctx.beginPath();ctx.ellipse(f.x,f.y+f.r*.7,f.r,f.r*.4,0,0,7);ctx.stroke();ctx.setLineDash([])}
  const gr=ctx.createRadialGradient(f.x-f.r*.35,y-f.r*.4,2,f.x,y,f.r);gr.addColorStop(0,'#fff');gr.addColorStop(.35,f.col);gr.addColorStop(1,f.dark);
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(f.x,y,f.r,0,7);ctx.fill();
  // указатель направления
  const a=f.face,tr=f.r+9;
  ctx.fillStyle=f.col;ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*(tr+7),y+Math.sin(a)*(tr+7));
  ctx.lineTo(f.x+Math.cos(a+.35)*tr,y+Math.sin(a+.35)*tr);ctx.lineTo(f.x+Math.cos(a-.35)*tr,y+Math.sin(a-.35)*tr);ctx.closePath();ctx.fill();
  ctx.font=`${Math.round(f.r*1.35)}px ${EMOJI}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.T.g,f.x,y+1);
  if(f.flash>0){ctx.globalAlpha=f.flash/.12*.7;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.x,y,f.r,0,7);ctx.fill()}
  ctx.restore();
  if(!f.dead&&f.stealthT<=0){const w=f.r*2.2;ctx.fillStyle='#000a';ctx.fillRect(f.x-w/2,f.y-f.r-16,w,5);
    ctx.fillStyle=f.hp/f.max>.3?'#6f6':'#f55';ctx.fillRect(f.x-w/2,f.y-f.r-16,w*f.hp/f.max,5)}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function drawHud(){
  ctx.fillStyle='#0b0a10';ctx.fillRect(0,0,W,AR.y0-4);
  for(const f of D.f){
    const left=f.idx===0,x0=left?16:W-16-360,k=CTRL[f.idx];
    ctx.textBaseline='middle';ctx.font=`22px ${EMOJI}`;ctx.textAlign=left?'left':'right';
    ctx.fillText(f.T.g,left?x0:x0+360,22);
    ctx.font='bold 16px system-ui,sans-serif';ctx.fillStyle=f.col;
    ctx.fillText(`${f.T.name} · ${Math.ceil(f.hp)}/${f.max}`,left?x0+32:x0+328,20);
    // полоса здоровья
    const bx=x0,by=34,bw=360;ctx.fillStyle='#000';rr(bx,by,bw,10,5);ctx.fill();
    const p=f.hp/f.max;ctx.fillStyle=p>.6?'#5d5':p>.3?'#ec4':'#e44';rr(left?bx:bx+bw*(1-p),by,bw*p,10,5);ctx.fill();
    // умения
    for(let i=0;i<2;i++){
      const ab=f.T.ab[i],w=176,ax=left?x0+i*184:x0+360-w-i*184,ay=50;
      ctx.fillStyle='#24202f';rr(ax,ay,w,18,4);ctx.fill();
      const cdp=f.cd[i]/ab.cd;
      if(cdp>0){ctx.fillStyle='#000a';rr(ax,ay,w*cdp,18,4);ctx.fill()}
      else{ctx.strokeStyle=f.col;ctx.lineWidth=1;rr(ax,ay,w,18,4);ctx.stroke()}
      ctx.fillStyle=cdp>0?'#888':'#fff';ctx.font='12px system-ui,sans-serif';ctx.textAlign='left';
      ctx.fillText(`[${i?k.kb:k.ka}] ${ab.n}`,ax+6,ay+9.5);
    }
  }
  const tl=Math.max(0,Math.ceil(D.limit-D.t));
  ctx.textAlign='center';ctx.font='bold 26px system-ui,sans-serif';ctx.fillStyle=tl<=10?'#f66':'#fff';ctx.fillText(tl,W/2,28);
  ctx.font='12px system-ui,sans-serif';ctx.fillStyle='#9d95ae';ctx.fillText(TER_NAME[D.ter],W/2,54);
}

let lastT=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-lastT)/1000);lastT=now;
  if(D){update(dt);if(D)draw()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const GAME_KEYS=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash','Period']);
addEventListener('keydown',e=>{
  if(ovl.classList.contains('on')&&(e.code==='Space'||e.code==='Enter')){
    const b=ovc.querySelector('[data-pri]');if(b&&!e.repeat){e.preventDefault();b.click()}return}
  if(D){keys.add(e.code);if(GAME_KEYS.has(e.code))e.preventDefault()}
  else if(e.code==='Escape'&&G.sel){G.sel=null;render()}
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());

if(!load())newGame(); else render();
try{if(!localStorage.getItem('sshibka-seen')){localStorage.setItem('sshibka-seen','1');showRules()}}catch(e){showRules()}
</script>
